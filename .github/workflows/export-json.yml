name: Export Seed JSON

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Artifact retention days"
        required: true
        type: number
        default: 7

permissions:
  contents: read

concurrency:
  group: export-json
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create config
        env:
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          session_token = os.environ.get("SESSION_TOKEN", "").strip()
          if not session_token:
              sys.exit("Set the SESSION_TOKEN secret.")

          config = {
              "api_key": "skip",
              "acc_loc": "en-US|US",
              "gtoken": "",
              "bullettoken": "",
              "session_token": session_token,
              "f_gen": "https://api.imink.app/f",
          }

          with open("config.txt", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=4, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Export seed JSON
        run: python s3s.py --getseed

      - name: Upload seed JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: splat3seedchecker-json-${{ github.run_id }}
          path: gear_*.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Remove runtime config
        if: always()
        run: rm -f config.txt
